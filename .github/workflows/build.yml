
name: Build InsulinGTAV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            clang-18 \
            lld-18 \
            llvm-18 \
            make \
            curl \
            tar

          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar

      - name: Install OpenOrbis SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/OpenOrbisSDK"
          mkdir -p "$SDK_ROOT"

          curl -fL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o "$RUNNER_TEMP/openorbis-sdk.tar.gz"

          tar -xzf "$RUNNER_TEMP/openorbis-sdk.tar.gz" \
            --strip-components=2 \
            -C "$SDK_ROOT"

          chmod +x -R "$SDK_ROOT/bin"

          test -f "$SDK_ROOT/include/orbis/libkernel.h"
          test -f "$SDK_ROOT/link.x"
          test -x "$SDK_ROOT/bin/linux/create-fself"
          test -x "$SDK_ROOT/bin/linux/readoelf"

          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin/linux" >> "$GITHUB_PATH"

          echo "OpenOrbis SDK installed and verified."

      - name: Build and install GoldHEN SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$OO_PS4_TOOLCHAIN"
          GH_SDK="$RUNNER_TEMP/GoldHEN_Plugins_SDK"

          test -f "$SDK_ROOT/include/orbis/libkernel.h"

          git clone --depth 1 \
            https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git \
            "$GH_SDK"

          make -C "$GH_SDK"

          mkdir -p "$SDK_ROOT/lib"
          mkdir -p "$SDK_ROOT/include/GoldHEN"

          cp "$GH_SDK/build/crtprx.o" "$SDK_ROOT/lib/"
          cp "$GH_SDK/libGoldHEN_Hook.a" "$SDK_ROOT/lib/"
          cp -a "$GH_SDK/include/." "$SDK_ROOT/include/GoldHEN/"

          test -f "$SDK_ROOT/lib/crtprx.o"
          test -f "$SDK_ROOT/lib/libGoldHEN_Hook.a"
          test -f "$SDK_ROOT/include/GoldHEN/GoldHEN.h"

          echo "GoldHEN SDK installed and verified."

      - name: Compile plugin
        shell: bash
        run: |
          set -euo pipefail
          bash build.sh

          test -f build/InsulinGTAV.prx

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: InsulinGTAV
          path: build/InsulinGTAV.prx
          if-no-files-found: error
