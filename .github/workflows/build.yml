
name: Build InsulinGTAV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 lld-18 curl tar
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

    
      - name: Build and install GoldHEN SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/OpenOrbisSDK"
          GH_SDK="$RUNNER_TEMP/GoldHEN_Plugins_SDK"

          export OO_PS4_TOOLCHAIN="$SDK_ROOT"

          git clone --depth 1 \
            https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git \
            "$GH_SDK"
          sed -i 's|-Iinclude|-Iinclude -isystem /usr/include/x86_64-linux-gnu|' "$GH_SDK/Makefile"
          make -C "$GH_SDK"

          mkdir -p "$SDK_ROOT/lib"
          mkdir -p "$SDK_ROOT/include/GoldHEN"

          cp "$GH_SDK/build/crtprx.o" "$SDK_ROOT/lib/"
          cp "$GH_SDK/libGoldHEN_Hook.a" "$SDK_ROOT/lib/"
          cp -a "$GH_SDK/include/." "$SDK_ROOT/include/GoldHEN/"

          echo "GoldHEN SDK installed successfully."



      - name: Install OpenOrbis SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/OpenOrbisSDK"
          mkdir -p "$SDK_ROOT"

          SDK_URL=$(curl -fsSL \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | jq -r '[.assets[] | select(.name | endswith(".tar.gz"))][0].browser_download_url // empty')

          test -n "$SDK_URL"

          curl -fL "$SDK_URL" -o "$RUNNER_TEMP/openorbis-sdk.tar.gz"

          tar -xzf "$RUNNER_TEMP/openorbis-sdk.tar.gz" \
          --strip-components=2 \
          -C "$SDK_ROOT"

          echo "Extracting SDK..."
          tar -xzf "$RUNNER_TEMP/openorbis-sdk.tar.gz" \
            --strip-components=2 \
            -C "$SDK_ROOT"

          chmod +x -R "$SDK_ROOT/bin"

          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin/linux" >> "$GITHUB_PATH"



      - name: Compile plugin
        run: bash build.sh

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: InsulinGTAV
          path: build/InsulinGTAV.prx
          if-no-files-found: error
