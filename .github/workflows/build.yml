
name: Build InsulinGTAV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 lld-18 curl tar
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

     
      - name: Install OpenOrbis SDK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/OpenOrbisSDK"

          SDK_URL=$(curl -fsSL \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | jq -r '[.assets[] | select(.name | endswith(".tar.gz"))][0].browser_download_url // empty')

          if [ -z "$SDK_URL" ]; then
            echo "Could not locate the OpenOrbis SDK archive."
            exit 1
          fi

          echo "Downloading: $SDK_URL"

          curl -fL "$SDK_URL" -o "$RUNNER_TEMP/openorbis-sdk.tar.gz"

          tar -xz -C "$RUNNER_TEMP/OpenOrbisSDK" \
            -f "$RUNNER_TEMP/openorbis-sdk.tar.gz" \
            bin/data bin/linux include lib scripts LICENSE link.x

          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/OpenOrbisSDK" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/OpenOrbisSDK/bin/linux" >> "$GITHUB_PATH"


      - name: Compile plugin
        run: bash build.sh

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: InsulinGTAV
          path: build/InsulinGTAV.prx
          if-no-files-found: error
