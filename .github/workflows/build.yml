
name: Build InsulinGTAV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 lld-18 curl tar
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld


      - name: Install OpenOrbis SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="$RUNNER_TEMP/OpenOrbisSDK"
          mkdir -p "$SDK_ROOT"

          SDK_URL=$(curl -fsSL \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | jq -r '[.assets[] | select(.name | endswith(".tar.gz"))][0].browser_download_url // empty')

          test -n "$SDK_URL"

          curl -fL "$SDK_URL" -o "$RUNNER_TEMP/openorbis-sdk.tar.gz"

          echo "Inspecting archive..."
          tar -tzf "$RUNNER_TEMP/openorbis-sdk.tar.gz" | head -30

          echo "Extracting SDK..."
          tar -xzf "$RUNNER_TEMP/openorbis-sdk.tar.gz" \
            --strip-components=2 \
            -C "$SDK_ROOT"

          chmod +x -R "$SDK_ROOT/bin"

          echo "OO_PS4_TOOLCHAIN=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin/linux" >> "$GITHUB_PATH"



      - name: Compile plugin
        run: bash build.sh

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: InsulinGTAV
          path: build/InsulinGTAV.prx
          if-no-files-found: error
