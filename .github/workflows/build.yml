
name: Build InsulinGTAV

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang-18 lld-18 curl tar
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld

      - name: Install OpenOrbis SDK
        run: |
          mkdir -p "$RUNNER_TEMP/OpenOrbisSDK"
          curl -fL https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/v0.5.4.tar.gz | tar -xz -C "$RUNNER_TEMP/OpenOrbisSDK" bin/data bin/linux include lib scripts LICENSE link.x
          echo "OO_PS4_TOOLCHAIN=$RUNNER_TEMP/OpenOrbisSDK" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/OpenOrbisSDK/bin/linux" >> "$GITHUB_PATH"

      - name: Compile plugin
        run: bash build.sh

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: InsulinGTAV
          path: build/InsulinGTAV.prx
          if-no-files-found: error
